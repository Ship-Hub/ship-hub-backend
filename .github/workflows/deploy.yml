name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Contabo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          tar --exclude='.git' \
              --exclude='node_modules' \
              --exclude='dist' \
              --exclude='.env' \
              --exclude='*.log' \
              --exclude='uploads' \
              -czf - . \
          | ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "tar -xzf - -C /var/www/ship-hub/backend"

      - name: Install, build & restart on server
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash << 'ENDSSH'
            set -e
            cd /var/www/ship-hub/backend
            chmod 600 .env
            npm ci
            npm run build
            npm run migrate
            pm2 delete shiphub-api 2>/dev/null || true
            pm2 start npm --name shiphub-api -- start
            pm2 save
          ENDSSH
